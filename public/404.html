<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — ANAPSE VIDEO GAMES</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #12100e;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #1e1b16;
      border: 1px solid #383023;
      border-radius: 1.5rem;
      padding: 2.5rem;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      color: #f59e0b;
      margin: 0 0 1rem;
      font-size: 2rem;
    }
    p {
      color: #a39c91;
      line-height: 1.6;
      margin: 0 0 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #f59e0b;
      color: #12100e;
      font-weight: 700;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
  <script>
    // GitHub Pages SPA router redirection: preserve path for client SPA routing
    (function () {
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // Handle custom domain or subfolder deployments
      var cleanPath = pathname.replace(/^\/ANAPSE-VIDEO-GAMES/, '');

      // Check for game routes
      if (cleanPath.startsWith('/juegos/')) {
        var slug = cleanPath.replace('/juegos/', '').replace('/', '');
        if (slug) {
          window.location.replace('/#game-' + slug);
          return;
        }
      }

      // Check for direct section routing
      if (cleanPath === '/proposals' || cleanPath === '/comunidad') {
        window.location.replace('/#' + cleanPath.replace('/', ''));
        return;
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">🎮</div>
    <h1>404 — No Encontrado</h1>
    <p>La página o el juego que buscas no existe o ha sido movido en el catálogo central de ANAPSE.</p>
    <a href="/" class="btn">Volver al Portal Central</a>
  </div>
</body>
</html>
